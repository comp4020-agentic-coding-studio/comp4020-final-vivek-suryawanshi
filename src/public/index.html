<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>COSMOS</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="cosmos-canvas" aria-label="3D view of space. Use the destination list to select an object with a keyboard."></canvas>

    <header id="topbar">
      <a id="logo" href="/">COSMOS</a>
      <div id="topbar-controls">
        <label id="low-graphics-label" hidden>
          <input type="checkbox" id="low-graphics-toggle" />
          Low graphics
        </label>
        <a id="about-link" href="/readme/">About</a>
      </div>
    </header>

    <nav id="object-list-wrap" aria-label="Objects to explore" hidden>
      <h2>Destinations</h2>
      <div id="object-list"></div>
    </nav>

    <section id="name-gate">
      <h2>Who's exploring?</h2>
      <form id="name-form">
        <input type="text" id="name-input" placeholder="Your name" maxlength="40" required />
        <button type="submit">Explore</button>
      </form>
    </section>

    <dialog id="object-panel" aria-labelledby="panel-name">
      <button type="button" id="panel-close" aria-label="Close">×</button>
      <canvas id="panel-preview-canvas"></canvas>
      <h2 id="panel-name"></h2>

      <div class="panel-tabs" role="tablist" aria-label="Object information">
        <button type="button" id="tab-overview" class="panel-tab" role="tab" aria-selected="true" aria-controls="tabpanel-overview">Overview</button>
        <button type="button" id="tab-facts" class="panel-tab" role="tab" aria-selected="false" aria-controls="tabpanel-facts" tabindex="-1">Facts</button>
        <button type="button" id="tab-atlas" class="panel-tab" role="tab" aria-selected="false" aria-controls="tabpanel-atlas" tabindex="-1">Discovery Atlas</button>
      </div>

      <div id="tabpanel-overview" class="panel-tabpanel" role="tabpanel" aria-labelledby="tab-overview" tabindex="0">
        <p id="panel-lookback" class="lookback"></p>
        <p id="panel-text"></p>
        <h3>Sources</h3>
        <ul id="panel-sources"></ul>
      </div>

      <div id="tabpanel-facts" class="panel-tabpanel" role="tabpanel" aria-labelledby="tab-facts" tabindex="0" hidden>
        <ul id="panel-facts"></ul>
      </div>

      <div id="tabpanel-atlas" class="panel-tabpanel" role="tabpanel" aria-labelledby="tab-atlas" tabindex="0" hidden>
        <form id="observation-form">
          <textarea id="observation-input" maxlength="280" placeholder="Share an observation…" required></textarea>
          <div class="observation-form-footer">
            <span id="observation-char-count">0/280</span>
            <button type="submit">Add observation</button>
          </div>
        </form>
        <ul id="observation-list"></ul>
      </div>
    </dialog>

    <script type="module" src="/cosmos/main.js"></script>
  </body>
</html>
